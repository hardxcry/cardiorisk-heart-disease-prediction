[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heartrisk"
version = "1.0.0"
description = "Coronary artery disease risk prediction with multi-site external validation"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "scikit-learn", "xgboost", "shap", "matplotlib",
  "plotly", "streamlit", "joblib", "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
